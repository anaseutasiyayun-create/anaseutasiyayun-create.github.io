<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Калькулятор</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a class="back" href="../index.html">← Учебные проекты</a>

    <div class="layout">
      <div class="calc">
        <div class="display">
          <div class="expr" id="expr"></div>
          <div class="value" id="value" aria-live="polite">0</div>
        </div>
        <div class="keys" id="keys">
          <button class="fn" data-action="clear">AC</button>
          <button class="fn" data-action="sign">±</button>
          <button class="fn" data-action="percent">%</button>
          <button class="op" data-op="/">÷</button>
          <button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button>
          <button class="op" data-op="*">×</button>
          <button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button>
          <button class="op" data-op="-">−</button>
          <button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button>
          <button class="op" data-op="+">+</button>
          <button class="zero" data-digit="0">0</button>
          <button data-action="dot">,</button>
          <button class="eq" data-action="equals">=</button>
        </div>
      </div>

      <div class="history" aria-label="История вычислений">
        <div class="history__head">
          <span>История</span><button id="clearHistory" type="button">Очистить</button>
        </div>
        <div id="history"></div>
      </div>

      <p class="hint">
        Работает с клавиатуры: цифры, + − * /, Enter, Backspace, Esc. Клик по записи в истории вернёт
        результат.
      </p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
