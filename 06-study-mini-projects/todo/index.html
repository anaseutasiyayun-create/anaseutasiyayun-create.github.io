<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Список дел</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a class="back" href="../index.html">← Учебные проекты</a>
    <main class="app">
      <h1>Список дел</h1>
      <p class="date" id="date"></p>
      <form id="form">
        <input
          class="input"
          type="text"
          id="input"
          placeholder="Что нужно сделать?"
          maxlength="120"
          autocomplete="off"
          aria-label="Новая задача"
        />
        <button class="add" type="submit">Добавить</button>
      </form>
      <div class="bar">
        <div class="filters" id="filters">
          <button data-filter="all" class="active">Все</button>
          <button data-filter="active">Активные</button>
          <button data-filter="done">Готовые</button>
        </div>
        <span class="counter" id="counter"></span>
      </div>
      <ul id="list"></ul>
      <div class="foot">
        <span>Двойной клик — изменить запись</span>
        <button id="clear" type="button">Удалить готовые</button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
